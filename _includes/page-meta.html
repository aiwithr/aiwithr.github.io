{% if page.date %}{% assign loc = page.locale | default: site.locale %}<div class="page-meta">
	{% if page.modified %}<meta itemprop="datePublished" content="{{ page.date | date: "%Y-%m-%dT%H:%M:%SZ" }}">{% else %}<meta itemprop="dateModified" content="{{ page.date | date: "%Y-%m-%dT%H:%M:%SZ" }}">{% endif %}
	<p>{{ site.data.messages.locales[loc].updated }} {% if page.modified %}<time datetime="{{ page.modified | date: "%Y-%m-%dT%H:%M:%SZ" }}" itemprop="dateModified">{{ page.modified | date: "%B %d, %Y" }}</time>{% else %}<time datetime="{{ page.date | date: "%Y-%m-%dT%H:%M:%SZ" }}" itemprop="datePublished">{{ page.date | date: "%B %d, %Y" }}</time>{% endif %}</p>
</div><!-- /.page-meta -->{% endif %}
