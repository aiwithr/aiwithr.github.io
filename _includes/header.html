<header id="masthead">
  <div class="inner-wrap">
    {% if page.lang == 'en' %}{% assign brand = site.title_en %}{% else %}{% assign brand = site.title %}{% endif %}
    <a href="{% if page.lang == 'en' %}{{ site.url }}/en/{% else %}{{ site.url }}/{% endif %}" class="site-title">{{ brand }}</a>
    <nav role="navigation" class="menu top-menu">
        {% include navigation.html %}
    </nav>
  </div><!-- /.inner-wrap -->

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-N9JZXN7KF9');

</header><!-- /.masthead -->
