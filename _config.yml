# Site wide configuration

title: "কৃত্রিম বুদ্ধিমত্তা | বাংলায়"
description: "বাংলায় মেশিন লার্নিং ও কৃত্রিম বুদ্ধিমত্তা শেখার সব রিসোর্স — রকিবুল হাসানের 'হাতেকলমে মেশিন লার্নিং' সিরিজসহ ১১টির বেশি বই, ফ্রি কোর্স, টিউটোরিয়াল ও ওয়ার্কশপ।"
logo: 120x120.gif
teaser: 400x250.gif
locale: bn_BD

# locale: en_US
url: "https://aiwithr.github.io"
feed:
  path: atom.xml

# Jekyll configuration

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
kramdown:
  toc_levels: 1..2
highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed


# Site owner
owner:
  name: "রকিবুল হাসান (Rakibul Hassan)"
  web: "https://aiwithr.github.io"
  twitter: "raqueeb"
  bio: "লেখক ও কলামিস্ট, TEDxRUET বক্তা, সাবেক ডিরেক্টর বিটিআরসি, Director AI Business and Transformation, Link3 Technologies"
  avatar: "bio-photo.jpg" # 160x160 px image for author byline
  google:
    plus: 
    ad-client: 
    ad-slot: 
    disqus-shortname:

include:
  - .htaccess
exclude:
  - "*.less"
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - GitHubsite.md
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - lib
  - log
  - node_modules
  - package.json
  - spec
  - tmp
